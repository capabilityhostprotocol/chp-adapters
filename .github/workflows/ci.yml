name: ci

# Packaging health for every public adapter in a clean runner: install it (pulling chp-core + its deps
# from PyPI, no local tree) and import it. This is the PUBLIC gate — "does a `pip install` work and the
# package load against the RELEASED chp-core." The full behavioral test suites are version-coupled to
# the in-development chp-core and run in the authoritative chp-dev gate, not here.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - chp-adapter-safety
          - chp-adapter-audit
          - chp-adapter-http
          - chp-adapter-filesystem
          - chp-adapter-github
          - chp-adapter-radicle
          - chp-adapter-process
          - chp-adapter-composition
          - chp-adapter-planning
          - chp-adapter-jobs
          - chp-adapter-mlx
          - chp-adapter-delegation
          - chp-adapter-mcp
          - chp-adapter-huggingface
          - chp-adapter-git
          - chp-adapter-host
          - chp-adapter-conformance
          - chp-safety-case
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install from a clean env (deps incl. released chp-core from PyPI)
        run: |
          python -m pip install --upgrade pip
          pip install "./packages/${{ matrix.package }}"
          pip list | grep -iE "chp-core|chp-adapter|cryptography|pyopenssl" || true
      - name: Import smoke (package loads against the released deps)
        run: |
          python -c "import importlib; m='${{ matrix.package }}'.replace('-', '_'); importlib.import_module(m); print('import OK:', m)"
