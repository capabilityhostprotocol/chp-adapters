name: ci

# Test every public adapter in a clean runner: install it (pulling chp-core + deps from PyPI) and run
# its suite. fail-fast:false so one adapter's result doesn't mask the others — the matrix shows the
# true per-adapter clean-room state.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - chp-adapter-safety
          - chp-adapter-audit
          - chp-adapter-http
          - chp-adapter-filesystem
          - chp-adapter-github
          - chp-adapter-radicle
          - chp-adapter-process
          - chp-adapter-composition
          - chp-adapter-planning
          - chp-adapter-jobs
          - chp-adapter-mlx
          - chp-adapter-delegation
          - chp-adapter-mcp
          - chp-adapter-huggingface
          - chp-adapter-git
          - chp-adapter-host
          - chp-adapter-conformance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install (adapter + deps from PyPI)
        run: |
          python -m pip install --upgrade pip
          pip install "./packages/${{ matrix.package }}[dev]" || pip install "./packages/${{ matrix.package }}"
          pip install pytest pytest-asyncio
      - name: Test
        run: |
          cd "packages/${{ matrix.package }}"
          if [ -d tests ] && ls tests/test_*.py >/dev/null 2>&1; then
            python -m pytest -q
          else
            echo "no tests in ${{ matrix.package }} — import smoke only"
            python -c "import importlib; importlib.import_module('${{ matrix.package }}'.replace('-', '_'))"
          fi
