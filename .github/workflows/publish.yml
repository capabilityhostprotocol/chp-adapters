name: publish

# Publish a CHP capability adapter to PyPI via OIDC Trusted Publishing — NO token.
# Tag format selects the package:  <package>-v<version>   e.g.  chp-adapter-safety-v0.57.2
# Each PyPI project configures a Trusted Publisher pointing at:
#   owner capabilityhostprotocol · repo chp-adapters · workflow publish.yml · environment release
on:
  push:
    tags:
      - 'chp-adapter-*-v*'
      - 'chp-safety-case-v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write          # mint the OIDC token PyPI trusts
    steps:
      # actions pinned to commit SHA (not moving tags) — supply-chain hygiene for a security product.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Derive package from tag
        id: pkg
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "name=${TAG%-v*}" >> "$GITHUB_OUTPUT"
          echo "publishing ${TAG%-v*} from tag ${TAG}"
      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build --sdist --wheel "packages/${{ steps.pkg.outputs.name }}"
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: packages/${{ steps.pkg.outputs.name }}/dist
          attestations: true          # PEP 740 provenance attestations, displayed on PyPI
