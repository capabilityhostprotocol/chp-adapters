name: publish

# Publish a CHP capability adapter to PyPI via OIDC Trusted Publishing — NO token.
# Tag format selects the package:  <package>-v<version>   e.g.  chp-adapter-safety-v0.57.2
# Each PyPI project configures a Trusted Publisher pointing at:
#   owner capabilityhostprotocol · repo chp-adapters · workflow publish.yml · environment release
on:
  push:
    tags:
      - 'chp-adapter-*-v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write          # mint the OIDC token PyPI trusts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Derive package from tag
        id: pkg
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "name=${TAG%-v*}" >> "$GITHUB_OUTPUT"
          echo "publishing ${TAG%-v*} from tag ${TAG}"
      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build --sdist --wheel "packages/${{ steps.pkg.outputs.name }}"
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/${{ steps.pkg.outputs.name }}/dist
